name: HNMO package

# Builds the HNMO folder (game server + admin panel + web client + game data + save database) for
# Windows, Ubuntu/Linux and macOS (Apple silicon), offers each as a download on the run's page and
# publishes them on the release page (links that always give the newest build):
#   HNMO-windows.zip, HNMO-linux.tar.gz, HNMO-macos.tar.gz
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', 'client/web/**', 'client/src/bin/**', '.github/workflows/hnmo-package.yml']

# Only the newest push builds; an older build still running is cancelled.
concurrency:
  group: hnmo-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runtime: win-x64
            # A portable PostgreSQL goes into the folder.
            postgres: https://get.enterprisedb.com/postgresql/postgresql-VERSION-windows-x64-binaries.zip
            archive: zip
          - name: macos
            runtime: osx-arm64
            postgres: https://get.enterprisedb.com/postgresql/postgresql-VERSION-osx-binaries.zip
            archive: tar
          - name: linux
            runtime: linux-x64
            # No portable PostgreSQL for Linux: the folder uses the one installed on the computer
            # (sudo apt install postgresql-16), see README.txt.
            postgres: ''
            archive: tar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the web client's library
        run: npm ci --prefix client/web
      - name: Get ffmpeg (sounds and music to Opus)
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Get a portable PostgreSQL (the save game database)
        if: matrix.postgres != ''
        run: |
          for version in 16.9-1 16.8-1 16.6-1 16.4-1; do
            url="${{ matrix.postgres }}"
            if curl -fsSL -o pg.zip "${url/VERSION/$version}"; then echo "PostgreSQL $version"; break; fi
          done
          unzip -q pg.zip -d pg
          # Only what the database needs; leave out pgAdmin, StackBuilder, docs and headers
          rm -rf pg/pgsql/pgAdmin* pg/pgsql/StackBuilder pg/pgsql/stackbuilder pg/pgsql/doc pg/pgsql/include pg/pgsql/symbols
          echo "POSTGRES_DIR=$GITHUB_WORKSPACE/pg/pgsql" >> "$GITHUB_ENV"
      - name: Build the HNMO folder
        run: client/web/tools/package-hnmo.sh "$GITHUB_WORKSPACE/server" ${{ matrix.runtime }} "$GITHUB_WORKSPACE/HNMO"
      - name: Pack it
        run: |
          if [ "${{ matrix.archive }}" = zip ]; then zip -qr "HNMO-${{ matrix.name }}.zip" HNMO
          else tar -czf "HNMO-${{ matrix.name }}.tar.gz" HNMO; fi
      - uses: actions/upload-artifact@v4
        with:
          name: HNMO-${{ matrix.name }}
          path: HNMO-${{ matrix.name }}.*
          retention-days: 14

  release:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish the packages as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la packages
          gh release delete hnmo-latest --cleanup-tag --yes || true
          gh release create hnmo-latest packages/* --target "$GITHUB_SHA" --latest \
            --title "HNMO" \
            --notes "The newest HNMO folder. Windows: unzip HNMO-windows.zip and double-click Start HNMO.bat. Ubuntu: install PostgreSQL 16 (sudo apt install postgresql-16), unpack HNMO-linux.tar.gz, run ./start-hnmo.sh. macOS (Apple silicon): unpack HNMO-macos.tar.gz, run ./start-hnmo.sh (the first time: xattr -dr com.apple.quarantine HNMO; if macOS stops the programs, sign them for this Mac: codesign --force --sign - HNMO/web/HNMO HNMO/server/HNMO.Startup). Guide: friends/README.md"
