name: HNMO package

# Builds the HNMO folder for Windows (game server + admin panel + web client + game
# data + save database), offers it as a download on the run's page and publishes it
# as HNMO-windows.zip on the release page (a link that always gives the newest build).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', 'client/web/**', 'client/src/bin/**', '.github/workflows/hnmo-package.yml']

# Only the newest push builds; an older build still running is cancelled.
concurrency:
  group: hnmo-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the web client's library
        run: npm ci --prefix client/web
      - name: Get ffmpeg (sounds and music to Opus)
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Get a portable PostgreSQL for Windows (the save game database)
        run: |
          for version in 16.9-1 16.8-1 16.6-1 16.4-1; do
            if curl -fsSL -o pg.zip "https://get.enterprisedb.com/postgresql/postgresql-$version-windows-x64-binaries.zip"; then echo "PostgreSQL $version"; break; fi
          done
          unzip -q pg.zip -d pg
          # Only what the database needs; leave out pgAdmin, StackBuilder, docs and headers
          rm -rf pg/pgsql/pgAdmin* pg/pgsql/StackBuilder pg/pgsql/doc pg/pgsql/include pg/pgsql/symbols
      - name: Build the HNMO folder
        run: POSTGRES_DIR="$GITHUB_WORKSPACE/pg/pgsql" client/web/tools/package-hnmo.sh "$GITHUB_WORKSPACE/server" win-x64 "$GITHUB_WORKSPACE/HNMO"
      - uses: actions/upload-artifact@v4
        with:
          name: HNMO-windows
          path: HNMO
          retention-days: 14
      - name: Publish HNMO-windows.zip as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -qr HNMO-windows.zip HNMO
          gh release delete hnmo-latest --cleanup-tag --yes || true
          gh release create hnmo-latest HNMO-windows.zip --target "$GITHUB_SHA" --latest \
            --title "HNMO for Windows" \
            --notes "The newest HNMO folder for Windows. Unzip it and double-click Start HNMO.bat. Guide: friends/README.md"
