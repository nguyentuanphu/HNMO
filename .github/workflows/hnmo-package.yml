name: HNMO package

# Builds ONE HNMO folder that runs on Windows, Ubuntu/Linux and macOS (game server + admin panel +
# web client + game data + save database), offers it as a download on the run's page and publishes
# it on the release page as HNMO.zip (a link that always gives the newest build). The server and the
# web server are portable .NET programs built once; runtime/<system> holds Microsoft's .NET runtime
# for each system. Each supported system also gets a portable PostgreSQL installation.
on:
  workflow_dispatch:
  pull_request:
    paths: ['client/web/tools/hnmo/**', 'client/web/tools/package-hnmo.sh', 'client/web/bridge/GameLauncher.cs', '.github/workflows/hnmo-package.yml']
  push:
    branches: [main]
    paths: ['server/**', 'client/web/**', 'client/src/bin/**', '.github/workflows/hnmo-package.yml']

# Only the newest push builds; an older build still running is cancelled.
concurrency:
  group: hnmo-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  postgres:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, rid: linux-x64 }
          - { runner: ubuntu-22.04-arm, rid: linux-arm64 }
          - { runner: macos-15-intel, rid: osx-x64 }
          - { runner: macos-15, rid: osx-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q patchelf zlib1g-dev
      - name: Build portable PostgreSQL
        run: |
          client/web/tools/hnmo/build-postgres.sh "$RUNNER_TEMP/postgres"
          tar -czf "postgres-${{ matrix.rid }}.tar.gz" -C "$RUNNER_TEMP/postgres" .
      - uses: actions/upload-artifact@v4
        with:
          name: postgres-${{ matrix.rid }}
          path: postgres-${{ matrix.rid }}.tar.gz
          retention-days: 1

      - name: Build the universal macOS Finder launcher
        if: matrix.rid == 'osx-arm64'
        run: |
          clang -Wall -Wextra -Werror -Os -arch arm64 -arch x86_64 -mmacosx-version-min=13.0 \
            client/web/tools/hnmo/start-macos.c -o hnmo-macos-start
          lipo hnmo-macos-start -verify_arch arm64 x86_64
          codesign --force --sign - hnmo-macos-start
          codesign --verify hnmo-macos-start
      - uses: actions/upload-artifact@v4
        if: matrix.rid == 'osx-arm64'
        with:
          name: macos-launcher
          path: hnmo-macos-start
          retention-days: 1

  package:
    needs: postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the web client's library
        run: npm ci --prefix client/web
      - name: Get ffmpeg (sounds and music to Opus)
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Get a portable PostgreSQL for Windows (the save game database)
        run: |
          for version in 16.9-1 16.8-1 16.6-1 16.4-1; do
            if curl -fsSL -o pg.zip "https://get.enterprisedb.com/postgresql/postgresql-$version-windows-x64-binaries.zip"; then echo "PostgreSQL $version"; break; fi
          done
          unzip -q pg.zip -d pg
          # Only what the database needs; leave out pgAdmin, StackBuilder, docs and headers
          rm -rf pg/pgsql/pgAdmin* pg/pgsql/StackBuilder pg/pgsql/stackbuilder pg/pgsql/doc pg/pgsql/include pg/pgsql/symbols
      - uses: actions/download-artifact@v4
        with:
          pattern: postgres-*
          path: pg-artifacts
          merge-multiple: true
      - name: Build the HNMO folder (Windows, Linux, macOS)
        run: |
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64; do
            mkdir -p "pg/$rid"
            tar -xzf "pg-artifacts/postgres-$rid.tar.gz" -C "pg/$rid"
          done
          POSTGRES_DIR="$GITHUB_WORKSPACE/pg/pgsql" POSTGRES_UNIX_DIR="$GITHUB_WORKSPACE/pg" \
            client/web/tools/package-hnmo.sh "$GITHUB_WORKSPACE/server" portable "$GITHUB_WORKSPACE/HNMO"
      - name: Pack it
        run: |
          zip -qr HNMO.zip HNMO
          client/web/tools/hnmo/package-deb.sh HNMO.zip "$(tr -d '[:space:]' < VERSION)" HNMO-linux.deb
          ls -la HNMO.zip HNMO-linux.deb
          du -sh HNMO HNMO/* | sort -h
      - uses: actions/upload-artifact@v4
        with:
          name: HNMO
          path: |
            HNMO.zip
            HNMO-linux.deb
          retention-days: 14
      # The update files on Cloudflare R2 (owner, 2026-11-21): every file stored once by its SHA-256 (files/<hash>),
      # only those not there yet are uploaded; the manifest goes to releases/<version>/manifest.json. The HNMO
      # developer publishes a version in the hub's console and the servers' "Update" downloads what changed.
      # Skipped while the R2 secrets aren't set.
      - name: Upload the update files to R2
        if: github.ref == 'refs/heads/main'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "R2 secrets not set: the update files are not uploaded."; exit 0
          fi
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 ls "s3://$R2_BUCKET/files/" --endpoint-url "$endpoint" | awk '{print $4}' | sort -u > have.txt || true
          python3 - <<'PY' > upload.txt
          import json
          m = json.load(open('HNMO/manifest.json'))
          have = set(open('have.txt').read().split())
          seen = set()
          for f in m['files']:
              if f['sha256'] not in have and f['sha256'] not in seen:
                  seen.add(f['sha256'])
                  print(f"{f['sha256']}\t{f['path']}")
          PY
          echo "$(wc -l < upload.txt) files to upload"
          while IFS="$(printf '\t')" read -r hash path; do
            aws s3 cp "HNMO/$path" "s3://$R2_BUCKET/files/$hash" --endpoint-url "$endpoint" --only-show-errors
          done < upload.txt
          version="$(python3 -c "import json;print(json.load(open('HNMO/manifest.json'))['version'])")"
          # Every build's manifest by its run, for trying it; a version's own manifest only once (a published
          # version never changes: raise VERSION for the next release).
          aws s3 cp HNMO/manifest.json "s3://$R2_BUCKET/builds/${{ github.run_number }}/manifest.json" --endpoint-url "$endpoint" --content-type application/json --only-show-errors
          if aws s3api head-object --bucket "$R2_BUCKET" --key "releases/$version/manifest.json" --endpoint-url "$endpoint" >/dev/null 2>&1; then
            echo "HNMO $version is already uploaded as a release: kept as it was (raise VERSION for a new one). This build: builds/${{ github.run_number }}"
          else
            aws s3 cp HNMO/manifest.json "s3://$R2_BUCKET/releases/$version/manifest.json" --endpoint-url "$endpoint" --content-type application/json --only-show-errors
            # The whole folder too, for new hosts and the websites' "Download HNMO".
            aws s3 cp HNMO.zip "s3://$R2_BUCKET/releases/$version/HNMO.zip" --endpoint-url "$endpoint" --only-show-errors
            echo "Uploaded HNMO $version as a release"
          fi

  # A real Windows computer unzips HNMO.zip, double-clicks "Start HNMO.bat" (cmd) and checks that the
  # game (8080) and the admin panel (8095) answer, so a folder that doesn't start on Windows is noticed.
  windows-start:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HNMO
      - name: Unzip
        shell: pwsh
        run: Expand-Archive -Path HNMO.zip -DestinationPath "C:\hnmo test (1)" -Force
      - name: Start HNMO.bat and wait for the game
        shell: pwsh
        run: |
          # A folder with a space and brackets, like a second download ("HNMO (1)"); the start file
          # runs the same way as a double-click (it starts HNMO in the background with its tray icon and ends, so the
          # wait is for the game and the admin panel, not for the start file). /s with the
          # outer quotes keeps cmd from eating the quotes around the paths.
          $folder = "C:\hnmo test (1)\HNMO"
          $log = "C:\hnmo test (1)\start.log"
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList "/d /s /c `"`"$folder\Start HNMO.bat`" > `"$log`" 2>&1`"" -WorkingDirectory $folder -PassThru
          $deadline = (Get-Date).AddMinutes(20)
          $game = $false; $admin = $false
          while ((Get-Date) -lt $deadline -and -not ($game -and $admin)) {
            Start-Sleep -Seconds 10
            try { $game = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 http://127.0.0.1:8080/index.html).StatusCode -eq 200 } catch { }
            try { $admin = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 http://127.0.0.1:8095/ -MaximumRedirection 0 -SkipHttpErrorCheck).StatusCode -lt 500 } catch { }
                    }
          Write-Host "game: $game, admin panel: $admin, start file still running: $(-not $p.HasExited) (it starts HNMO in the background and ends)"
          Get-Content $log -Tail 80 -ErrorAction SilentlyContinue
          if (-not ($game -and $admin)) {
            Get-ChildItem "$folder\save\logs" -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 60 }
          }
          if (-not ($game -and $admin)) { throw "HNMO didn't start on Windows" }
          Get-Process | Where-Object { $_.Path -like "$folder*" } | Stop-Process -Force -ErrorAction SilentlyContinue

  macos-package:
    needs: package
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HNMO
      - uses: actions/download-artifact@v4
        with:
          name: macos-launcher
          path: launch-artifacts
      - name: Assemble and sign the macOS app
        run: client/web/tools/hnmo/package-macos.sh HNMO.zip HNMO-macos.zip launch-artifacts/hnmo-macos-start
      - uses: actions/upload-artifact@v4
        with:
          name: HNMO-macos
          path: HNMO-macos.zip
          retention-days: 14

  linux-start:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HNMO
      - name: Install Linux desktop integration test tools
        run: sudo apt-get update -q && sudo apt-get install -y -q desktop-file-utils libglib2.0-bin xdg-utils
      - name: Start the installed server and check the database
        run: client/web/tools/hnmo/smoke-unix-package.sh "$PWD"

  macos-start:
    needs: macos-package
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HNMO-macos
      - name: Start the installed server and check the database
        run: client/web/tools/hnmo/smoke-unix-package.sh "$PWD"

  # Publish only after the downloaded package starts on all supported platforms.
  release:
    needs: [package, windows-start, linux-start, macos-start]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HNMO
      - uses: actions/download-artifact@v4
        with:
          name: HNMO-macos
      # The macOS app and the Debian/Ubuntu package next to HNMO.zip on the update storage (owner, 2026-11-27: downloads
      # come from Cloudflare, not GitHub): the hub's /download?os=macos|linux sends there. A version's files are written
      # once (raise VERSION for a new release). Skipped while the R2 secrets aren't set; it never fails the release.
      - name: Upload the macOS and Debian/Ubuntu downloads to R2
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "R2 secrets not set: the macOS and Debian/Ubuntu downloads are not uploaded."; exit 0
          fi
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          version="$(tr -d '[:space:]' < VERSION)"
          for file in HNMO-macos.zip HNMO-linux.deb; do
            key="releases/$version/$file"
            if aws s3api head-object --bucket "$R2_BUCKET" --key "$key" --endpoint-url "$endpoint" >/dev/null 2>&1; then
              echo "$key is already there: kept as it was."
            else
              aws s3 cp "$file" "s3://$R2_BUCKET/$key" --endpoint-url "$endpoint" --only-show-errors
              echo "Uploaded $key"
            fi
          done
      - name: Publish HNMO.zip as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The same file also under the old name, so that earlier download links keep working.
          cp HNMO.zip HNMO-windows.zip
          gh release delete hnmo-latest --cleanup-tag --yes || true
          gh release create hnmo-latest HNMO.zip HNMO-windows.zip HNMO-linux.deb HNMO-macos.zip --target "$GITHUB_SHA" --latest \
            --title "HNMO" \
            --notes "Windows: extract HNMO.zip and open Start HNMO.bat. macOS: extract HNMO-macos.zip and open Start HNMO.app. Ubuntu and Debian: install HNMO-linux.deb and open HNMO from the applications menu. See the packaged README for first-launch and save instructions."
