name: Client pipe self-check

# The desktop client's connection pipe (ClientLibrary/DeferredTcpPipe.cs) on a clean Windows and Linux machine. The
# close checks must run here (HNMO_PIPE_REQUIRE_CLOSE_CHECKS): a computer whose loopback loses the FIN of a half-close
# (some traffic filtering software does) skips them, a runner must not.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'client/ClientLibrary/DeferredTcpPipe.cs'
      - 'client/tests/network/deferred_tcp_pipe_self_check/**'
      - 'server/src/Network/**'
      - '.github/workflows/client-pipe-selfcheck.yml'

jobs:
  selfcheck:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HNMO_PIPE_REQUIRE_CLOSE_CHECKS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Self-check, three runs
        shell: bash
        run: |
          for run in 1 2 3; do
            echo "run $run"
            dotnet run --project client/tests/network/deferred_tcp_pipe_self_check -c Release
          done
