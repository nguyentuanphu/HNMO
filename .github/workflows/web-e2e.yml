name: Web game tests

# Plays the web game in a browser against a real HNMO server (demo mode: its data in memory):
# log in, enter the world, inventory, moving and equipping items, the vault.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['client/web/**', 'server/**', '.github/workflows/web-e2e.yml']
  pull_request:
    paths: ['client/web/**', 'server/**', '.github/workflows/web-e2e.yml']

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      ADMIN_URL: http://127.0.0.1:8095
      BASE_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the web client and the test browser
        run: |
          npm ci --prefix client/web
          # The Ubuntu mirrors are sometimes caught mid-sync ("File has unexpected size"): try again.
          cd client/web
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && break
            [ "$attempt" = 3 ] && exit 1
            echo "Browser install failed (attempt $attempt); retrying in 30 s"; sleep 30
          done
      - name: Build the server and the web client
        run: |
          dotnet build server/src/Startup/HNMO.Startup.csproj -c Release -v quiet
          npm run build --prefix client/web
          dotnet build client/web/bridge/HNMO.Web.csproj -c Release -v quiet
      - name: Start the server (demo) and the web client
        run: |
          (cd server/src/Startup && ASPNETCORE_URLS=http://127.0.0.1:8095 nohup dotnet run -c Release --no-build -- -demo -autostart -resolveIP:loopback > "$RUNNER_TEMP/server.log" 2>&1 &)
          (cd client/web/bridge && nohup dotnet run -c Release --no-build > "$RUNNER_TEMP/web.log" 2>&1 &)
          for i in $(seq 1 120); do (echo > /dev/tcp/127.0.0.1/44406) 2>/dev/null && break; sleep 5; done
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8081/ > /dev/null && break; sleep 2; done
          for i in $(seq 1 60); do curl -sf "$ADMIN_URL/" > /dev/null && break; sleep 2; done
          (echo > /dev/tcp/127.0.0.1/44406) && curl -sf -o /dev/null "$BASE_URL/" && curl -sf -o /dev/null "$ADMIN_URL/"
      - name: Play the tests
        run: cd client/web && CI=1 npx playwright test --workers=1 --shard=${{ matrix.shard }}/8 --reporter=github,line
      - name: Logs and report
        if: failure() || cancelled()
        # Only the server's warnings and errors: the full logs (in the artifact) push the test results off the
        # end of the job's log.
        run: grep -E "\[(Warning|Error|Fatal)\]|Exception" "$RUNNER_TEMP/server.log" | tail -n 40 || true
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: web-e2e-report-${{ matrix.shard }}
          path: |
            client/web/playwright-report
            client/web/test-results
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/web.log
          retention-days: 14
