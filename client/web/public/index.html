<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/images/icon-192.png">
  <meta name="theme-color" content="#11110e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/images/icon-192.png">
  <title>HenryN Mu Online</title>
  <style>
    :root { --panel: rgba(10, 12, 20, .86); --line: rgba(255, 255, 255, .14); --gold: #c9a24a; --text: #e6e8ef; --muted: #9aa0b2; --error: #ef7a6c; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; background: #0a0d14; color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    #stage { position: fixed; inset: 0; }
    #view { width: 100%; height: 100%; display: block; }
    .hud { position: fixed; left: 12px; right: 12px; top: calc(5.5vh + 6px); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; pointer-events: none; }
    .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font-variant-numeric: tabular-nums; }
    .chip label, .chip select { pointer-events: auto; }
    select, input { background: #151a26; color: inherit; border: 1px solid #2c3446; border-radius: 4px; padding: 6px 8px; font: inherit; }
    #loading { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); width: min(520px, 86vw); }
    #track { height: 4px; background: rgba(255, 255, 255, .12); border-radius: 2px; overflow: hidden; margin-top: 6px; }
    #bar { height: 100%; width: 0; background: var(--gold); transition: width .2s; }
    body.ready #track { display: none; }
    #login { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at center, #1a1f2e 0%, #07090f 70%); overflow-y: auto; }
    /* Phones held sideways (short screens): the login form starts at the top, tighter, and scrolls. */
    @media (max-height: 520px) {
      #login { place-items: start center; padding: 8px 16px; }
      #login .panel { padding: 14px 18px; gap: 8px; }
      #login:not([hidden]) ~ #loading { display: none; }
    }
    /* The game's touch buttons only in the world, not over the login and character choice. */
    #login:not([hidden]) ~ #touchBar, #login:not([hidden]) ~ #touchFight, #login:not([hidden]) ~ #touchMore, #login:not([hidden]) ~ #touchRotate { display: none !important; }
    .panel { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: grid; gap: 14px; }
    .panel h1 { margin: 0; font-size: 20px; letter-spacing: .04em; color: var(--gold); }
    fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; }
    .row { display: grid; gap: 4px; }
    .row label { color: var(--muted); font-size: 12px; }
    .split { display: grid; grid-template-columns: 1fr 90px; gap: 8px; }
    details summary { color: var(--muted); cursor: pointer; font-size: 12px; }
    details[open] { display: grid; gap: 10px; }
    .buttons { display: flex; gap: 8px; }
    button { font: inherit; border-radius: 6px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: #1b2131; color: var(--text); }
    button.primary { background: var(--gold); color: #1a1408; border-color: var(--gold); font-weight: 600; flex: 1; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
    .choices { display: grid; gap: 6px; }
    .choice { text-align: left; display: flex; justify-content: space-between; gap: 8px; }
    .choice small { color: var(--muted); }
    #loginError { color: var(--error); margin: 0; }
    .hint { color: var(--muted); font-size: 12px; margin: 0; }
    #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .label { position: absolute; left: 0; top: 0; font-size: 12px; white-space: nowrap; color: #f2f3f7; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
    .label.npc { color: #9fe0a8; }
    #soundButton { pointer-events: auto; width: 30px; height: 30px; padding: 0; border-radius: 50%; font: 700 15px/1 system-ui, sans-serif; color: var(--gold); background: var(--panel); border: 1px solid var(--gold); }
    #soundButton[aria-pressed="true"] { color: var(--muted); border-color: var(--line); text-decoration: line-through; }
    .community { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .community-link { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--gold); color: var(--gold); text-decoration: none; font-weight: 600; }
    .community-link:hover { background: var(--gold); color: #1b1408; }
    .community-zalo { border-color: #0068ff; color: #6aa8ff; }
    .community-zalo:hover { background: #0068ff; color: #fff; }
    .language-picker { pointer-events: auto; display: inline-flex; gap: 4px; align-items: center; }
    .language-picker button { height: 30px; min-width: 38px; padding: 0 8px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font: 600 12px system-ui, sans-serif; }
    .language-picker button[aria-pressed="true"] { color: #1b1408; background: var(--gold); border-color: var(--gold); }
    .language-picker select { height: 30px; max-width: 120px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font: 12px system-ui, sans-serif; }
    #guideButton { pointer-events: auto; width: 30px; height: 30px; padding: 0; border-radius: 50%; font: italic 700 16px/1 Georgia, serif; color: var(--gold); background: var(--panel); border: 1px solid var(--gold); }
    #settingsButton { pointer-events: auto; width: 30px; height: 30px; padding: 0; border-radius: 50%; font: 700 16px/1 system-ui, sans-serif; color: var(--gold); background: var(--panel); border: 1px solid var(--gold); }
    #guide { position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, .6); display: grid; place-items: center; padding: 16px; }
    #guide .frame { position: relative; width: min(900px, 100%); height: min(88vh, 100%); background: #0b0e16; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    #guide iframe { width: 100%; height: 100%; border: 0; display: block; }
    #guide .close { position: absolute; right: 10px; top: 10px; padding: 4px 10px; }
    #guide .onboarding { position: absolute; right: 80px; top: 10px; padding: 4px 10px; }
    #guide .timetable { position: absolute; right: 205px; top: 10px; padding: 4px 10px; }
    .map-picker { position: fixed; right: 12px; top: 12px; display: flex; gap: 8px; align-items: center; }
    .map-picker label { color: var(--muted); font-size: 12px; }
  </style>
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="stage"><canvas id="view"></canvas></div>
  <div id="labels"></div>
  <div id="guide" hidden role="dialog" aria-label="Guide" data-game-name="{game} guide" data-game-name-attr="aria-label">
    <div class="frame"><iframe title="Guide" src="about:blank"></iframe><button type="button" class="timetable" id="guideTimetable" title="Event and boss timetable (H)">Timetable (H)</button><button type="button" class="onboarding" id="guideOnboarding" title="The guided first steps for new characters (Y)">New-player guide</button><button type="button" class="close">Close</button></div>
  </div>
  <div class="hud" id="hud" hidden>
    <span class="chip" id="heroName">-</span>
    <span class="chip">Cell <span id="position">-</span></span>
    <span class="chip" id="fps">- fps</span>
    <button type="button" id="soundButton" title="Sound on / off" aria-label="Sound on or off" aria-pressed="false">♪</button>
    <button type="button" id="guideButton" title="Guide: what to play and what each feature does" aria-label="Open the guide" data-game-name="Open the {game} guide" data-game-name-attr="aria-label">i</button>
    <span class="language-picker" data-no-i18n role="group" aria-label="Language / Ngôn ngữ"><button type="button" data-lang="en" aria-pressed="true" title="English">EN</button><button type="button" data-lang="vi" aria-pressed="false" title="Tiếng Việt">VN</button><select class="language-more" title="More languages" aria-label="More languages"><option value="">More…</option></select></span>
    <button type="button" id="settingsButton" title="Settings (O)" aria-label="Open the settings">⚙</button>
  </div>
  <div id="login">
    <form class="panel" id="loginForm" autocomplete="on">
      <h1 data-game-name>HenryN Mu Online</h1>
      <fieldset>
        <div class="row"><label for="username">Account</label><input id="username" name="username" required maxlength="10" autocomplete="username"></div>
        <div class="row"><label for="password">Password</label><input id="password" name="password" type="password" required maxlength="20" autocomplete="current-password"></div>
        <details>
          <summary>Server</summary>
          <div class="split">
            <div class="row"><label for="host">Connect server</label><input id="host" name="host" required></div>
            <div class="row"><label for="port">Port</label><input id="port" name="port" type="number" min="1" max="65535" required></div>
          </div>
          <div class="row"><label for="relay">Relay</label><input id="relay" name="relay" required></div>
        </details>
        <div class="row"><label>Language / Ngôn ngữ</label><span class="language-picker" id="loginLanguage" data-no-i18n role="group" aria-label="Language / Ngôn ngữ"><button type="button" data-lang="en" aria-pressed="true" title="English">EN</button><button type="button" data-lang="vi" aria-pressed="false" title="Tiếng Việt">VN</button><select class="language-more" title="More languages" aria-label="More languages"><option value="">More…</option></select></span></div>
        <div class="buttons">
          <button class="primary" type="submit">Connect</button>
        </div>
      </fieldset>
      <p id="loginError" role="alert" hidden></p>
      <div class="choices" id="servers" hidden></div>
      <div class="choices" id="characters" hidden></div>
      <p class="hint community" id="communityLinks" data-community-links="Contact:" hidden></p>
      <p class="hint">No account yet? <a href="/account.html" style="color:var(--gold)">Create one</a> (free coins included). <a href="/topup.html" style="color:var(--gold)">Top up coins</a>. Test accounts: test300 / test300. New here? <a href="#" id="loginGuide" style="color:var(--gold)">Read the guide</a>.</p>
    </form>
  </div>
  <div id="loading" class="chip"><div id="status">Log in to play.</div><div id="track"><div id="bar"></div></div></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
