<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/images/icon-192.png">
  <meta name="theme-color" content="#11110e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/images/icon-192.png">
  <title>HenryN Mu Online</title>
  <style>
    :root { --panel: rgba(10, 12, 20, .86); --line: rgba(255, 255, 255, .14); --gold: #c9a24a; --text: #e6e8ef; --muted: #9aa0b2; --error: #ef7a6c; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; background: #0a0d14; color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    #stage { position: fixed; inset: 0; }
    #view { width: 100%; height: 100%; display: block; }
    .hud { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); top: max(calc(5.5vh + 6px), env(safe-area-inset-top, 0px)); display: flex; gap: 6px; flex-wrap: nowrap; align-items: center; pointer-events: none; z-index: 45; }
    /* In the game, on the line of the map's frame (the auto play bar: map, cell, helper buttons), right of it across all viewports (ui/autoPlayBar.ts measures it). */
    html[style*="--helper-bar-right"] .hud { left: calc(var(--helper-bar-right) + 6px); top: calc(var(--helper-bar-middle) - 17px); right: auto; flex-wrap: nowrap; max-width: calc(100vw - var(--helper-bar-right) - 10px); }
    @media (min-width: 821px) {
      html[style*="--helper-bar-right"] .hnmo-guide-button { top: calc(var(--helper-bar-bottom) + 6px); }
    }
    body.hnmo-modern-hud .hud { display: none; }
    .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font-variant-numeric: tabular-nums; }
    .chip label, .chip select { pointer-events: auto; }
    /* HNMO's vault pages, above the open vault window. */
    .hnmo-vault-pages { position: fixed; z-index: 30; display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 4px 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--text); font-size: 12px; pointer-events: auto; }
    .hnmo-vault-pages[hidden] { display: none; }
    .hnmo-vault-pages-label { color: var(--gold); text-align: center; font-size: 11px; }
    .hnmo-vault-pages button { min-width: 26px; min-height: 24px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--text); font: inherit; cursor: pointer; }
    .hnmo-vault-pages button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #1a1408; font-weight: 600; cursor: default; }
    .hnmo-vault-pages button:disabled:not([aria-pressed="true"]) { opacity: .5; cursor: default; }
    .hnmo-vault-pages .hnmo-vault-page-buy { color: var(--gold); border-style: dashed; }
    .hnmo-stacks-panel { position: fixed; z-index: 31; width: 240px; display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--text); font-size: 12px; pointer-events: auto; }
    .hnmo-stacks-panel[hidden] { display: none; }
    .hnmo-stacks-title { color: var(--gold); font-weight: 600; }
    .hnmo-stacks-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .hnmo-stacks-row button, .hnmo-stacks-close { min-height: 24px; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--gold); background: rgba(201, 162, 74, .15); color: var(--text); font: inherit; cursor: pointer; }
    .hnmo-stacks-on { color: #7fd18b; }
    .hnmo-vault-pages .hnmo-stacks-button { font-size: 11px; }
    .hnmo-vault-pages .hnmo-stacks-button[hidden] { display: none; }
    select, input { background: #151a26; color: inherit; border: 1px solid #2c3446; border-radius: 4px; padding: 6px 8px; font: inherit; }
    #loading { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); width: min(520px, 86vw); }
    #track { height: 4px; background: rgba(255, 255, 255, .12); border-radius: 2px; overflow: hidden; margin-top: 6px; }
    #bar { height: 100%; width: 0; background: var(--gold); transition: width .2s; }
    body.ready #track { display: none; }
    #login { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at center, #1a1f2e 0%, #07090f 70%); overflow-y: auto; }
    /* Phones held sideways (short screens): the login form starts at the top, tighter, and scrolls. */
    @media (max-height: 520px) {
      #login { place-items: start center; padding: 8px 16px; }
      #login .panel { padding: 14px 18px; gap: 8px; }
      #login:not([hidden]) ~ #loading { display: none; }
    }
    /* The game's touch buttons only in the world, not over the login and character choice. */
    #login:not([hidden]) ~ #touchBar, #login:not([hidden]) ~ #touchFight, #login:not([hidden]) ~ #touchMore, #login:not([hidden]) ~ #touchRotate, #login:not([hidden]) ~ #mobileHud, #login:not([hidden]) ~ #mobileHudSheet { display: none !important; }
    .saved-accounts { display: grid; gap: 6px; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(201, 162, 74, .28); background: rgba(255, 255, 255, .03); }
    .saved-accounts-head { font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: .06em; }
    .saved-accounts-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .saved-account-chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255, 255, 255, .05); padding: 2px 6px 2px 10px; }
    .saved-account-pick { all: unset; cursor: pointer; font-size: 12px; color: var(--text); font-weight: 600; }
    .saved-account-pick small { color: var(--muted); font-weight: 400; margin-left: 4px; }
    .saved-account-del { all: unset; cursor: pointer; width: 18px; height: 18px; border-radius: 50%; text-align: center; line-height: 18px; color: var(--muted); font-size: 13px; }
    .saved-account-del:hover { color: var(--error); background: rgba(239, 122, 108, .15); }
    .panel { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: grid; gap: 14px; }
    .panel h1 { margin: 0; font-size: 20px; letter-spacing: .04em; color: var(--gold); }
    fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; }
    .row { display: grid; gap: 4px; }
    .row label { color: var(--muted); font-size: 12px; }
    .split { display: grid; grid-template-columns: 1fr 90px; gap: 8px; }
    details summary { color: var(--muted); cursor: pointer; font-size: 12px; }
    details[open] { display: grid; gap: 10px; }
    .buttons { display: flex; gap: 8px; }
    button { font: inherit; border-radius: 6px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: #1b2131; color: var(--text); }
    button.primary { background: var(--gold); color: #1a1408; border-color: var(--gold); font-weight: 600; flex: 1; }
    a.website-login { display: block; text-align: center; text-decoration: none; font: inherit; border-radius: 6px; padding: 9px 14px; background: var(--gold); color: #1a1408; border: 1px solid var(--gold); font-weight: 600; }
    a.website-login:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
    .choices { display: grid; gap: 6px; }
    .choice { text-align: left; display: flex; justify-content: space-between; gap: 8px; }
    .choice small { color: var(--muted); }
    /* The 3D character stage (scenes/characterStage.ts), owner 2026-11-28: no login box (players log in on the website),
       no list box; each character's name, level and class stand over it (#stageLabels), the desktop's char_sel_main
       plates (Create, Delete, OK) do the rest, and a discreet HNMO mark sits at the top. The list's buttons stay in the
       page as tiny invisible hooks (keyboard and tests use them). :root raises these over the website theme's #login art. */
    :root body.stage-world #login { background: transparent; pointer-events: none; padding: 16px; }
    :root body.stage-world:not(.stage-dialog) #login .panel { pointer-events: auto; position: fixed; left: 0; bottom: 0; width: auto; padding: 0; gap: 0; background: transparent; border: 0; box-shadow: none; backdrop-filter: none; }
    :root body.stage-world:not(.stage-dialog) #loginForm > :not(#characters, #servers, #loginError) { display: none; }
    :root body.stage-world:not(.stage-dialog) #characters:not([hidden]) { display: flex; gap: 0; }
    /* The server choice over the stage is the desktop's server_select window (#stageServers); the plain list's server
       buttons stay as tiny invisible hooks, its headings go. "Play now" stays a button at the bottom. */
    :root body.stage-world:not(.stage-dialog) #login .panel:has(#servers.seasons:not([hidden])) { width: auto; }
    :root body.stage-world:not(.stage-dialog) #servers.seasons:not([hidden]), :root body.stage-world:not(.stage-dialog) #servers .season-column { display: flex; gap: 0; padding: 0; border: 0; background: none; }
    :root body.stage-world:not(.stage-dialog) #servers .seasons-title, :root body.stage-world:not(.stage-dialog) #servers h2, :root body.stage-world:not(.stage-dialog) #servers .season-empty { display: none; }
    :root body.stage-world:not(.stage-dialog) #servers .choice { width: 2px; height: 2px; min-width: 0; min-height: 0; margin: 0; padding: 0; border: 0; overflow: hidden; font-size: 0; opacity: 0; }
    :root body.stage-world:not(.stage-dialog) #servers #quickPlay { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); flex: none; width: auto; display: grid; gap: 2px; text-align: center; }
    #stageServers { z-index: 30; }
    :root body.stage-world:not(.stage-dialog) #characters .choice, :root body.stage-world:not(.stage-dialog) #characters .character-actions,
    :root body.stage-world:not(.stage-dialog) #characters .character-actions button { width: 2px; height: 2px; min-width: 0; min-height: 0; margin: 0; padding: 0; border: 0; overflow: hidden; font-size: 0; opacity: 0; }
    :root body.stage-world:not(.stage-dialog) #loginError { position: fixed; top: 44px; left: 50%; transform: translateX(-50%); max-width: min(520px, 90vw); padding: 6px 12px; border-radius: 6px; background: rgba(10, 12, 18, .86); }
    :root body.stage-world.stage-dialog #login { place-items: center; }
    /* Creating: the form on the right, the class standing in 3D where the new character will stand (the stage's preview). */
    :root body.stage-world.stage-dialog.stage-create #login { place-items: start end; }
    .stage-label.preview b { color: var(--gold); }
    :root body.stage-world.stage-dialog #login .panel { pointer-events: auto; width: min(360px, 100%); background: rgba(10, 12, 18, .9); }
    :root body.stage-world.stage-dialog #loginForm > :not(#characters, #loginError) { display: none; }
    body:not(.character-stage) #characters .character-actions { display: none; }
    :root body.stage-world .website-back-home, :root body.stage-world #loading { display: none; }
    #stageLabels { position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
    #stageBrand { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font: 600 12px/1 Georgia, serif; letter-spacing: .4em; color: var(--gold); opacity: .55; text-shadow: 0 1px 2px #000; }
    .stage-label { position: absolute; left: 0; top: 0; display: grid; justify-items: center; gap: 1px; padding: 2px 8px; border-radius: 4px; white-space: nowrap; text-shadow: 0 1px 2px #000, 0 0 6px #000; color: #d8d2c0; font: 12px/1.2 system-ui, sans-serif; opacity: .8; }
    .stage-label b { font-size: 13px; color: #f2e6c4; }
    .stage-label small { font-size: 11px; color: #b9b3a3; }
    .stage-label.picked { opacity: 1; }
    .stage-label.picked b { color: var(--gold); }
    /* A phone held upright: the five labels share a narrow screen, smaller and tighter (no horizontal scroll). */
    @media (max-width: 480px) {
      .stage-label { padding: 1px 3px; font-size: 10px; }
      .stage-label b { font-size: 11px; }
      .stage-label small { font-size: 9px; }
      #stageBrand { font-size: 10px; letter-spacing: .3em; }
      :root body.stage-world.stage-dialog #login { padding: 8px; }
      :root body.stage-world.stage-dialog #login .panel { padding: 14px; box-sizing: border-box; max-width: 100%; }
      :root body.stage-world.stage-dialog #login .panel .row { min-width: 0; }
      :root body.stage-world.stage-dialog #login .panel input, :root body.stage-world.stage-dialog #login .panel select { min-width: 0; max-width: 100%; box-sizing: border-box; }
    }
    /* The game's loading bar (ui/loadingProgress.ts) shows instead of the page's status line while it is up. */
    body.loading-bar #loading { display: none; }
    #stagePlates { z-index: 30; }
    body.stage-dialog #stagePlates, body.stage-dialog:not(.stage-create) #stageLabels .stage-label { display: none; }
    .season-badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: .02em; vertical-align: middle; }
    .season-badge.season-s6 { background: #3a3324; color: #e3c07a; border: 1px solid #6b5a36; }
    .season-badge.season-s9 { background: #1f3340; color: #8fd3f0; border: 1px solid #3b6d85; }
    /* The start screen: Season 6.3 and Season 9 servers side by side (one column on a phone). */
    #login .panel:has(#servers.seasons:not([hidden])) { width: min(760px, 100%); }
    #servers.seasons { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); align-items: start; gap: 12px; }
    @media (max-width: 560px) { #servers.seasons { grid-template-columns: minmax(0, 1fr); } }
    .season-column .choice { display: grid; gap: 2px; }
    .season-column .server-name { overflow-wrap: anywhere; }
    #servers .seasons-title { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: 12px; }
    .season-column { display: grid; gap: 6px; align-content: start; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255, 255, 255, .02); }
    .season-column.season-s6 { border-color: #6b5a36; }
    .season-column.season-s9 { border-color: #3b6d85; }
    .season-column.season-arena { border-color: #8a3b3b; }
    .season-column h2 { margin: 0 0 2px; font-size: 15px; display: grid; gap: 2px; }
    .season-column.season-s6 h2 { color: #e3c07a; }
    .season-column.season-s9 h2 { color: #8fd3f0; }
    .season-column.season-arena h2 { color: #f0a08f; }
    .season-column h2 small { color: var(--muted); font-size: 11px; font-weight: 400; }
    .season-empty { margin: 0; color: var(--muted); font-size: 12px; }
    #loginError { color: var(--error); margin: 0; }
    .hint { color: var(--muted); font-size: 12px; margin: 0; }
    #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .label { position: absolute; left: 0; top: 0; font-size: 12px; white-space: nowrap; color: #f2f3f7; text-shadow: 0 1px 2px #000, 0 0 4px #000; text-align: center; }
    .label.npc { color: #9fe0a8; }
    .label-speech { display: block; max-width: 240px; white-space: normal; padding: 3px 7px; margin-bottom: 3px; border-radius: 4px; background: rgba(12, 16, 26, 0.88); border: 1px solid rgba(255, 224, 150, 0.45); color: #f6e7c4; font-size: 12px; line-height: 1.3; }
    #soundButton { pointer-events: auto; width: 30px; height: 30px; padding: 0; border-radius: 50%; font: 700 15px/1 system-ui, sans-serif; color: var(--gold); background: var(--panel); border: 1px solid var(--gold); }
    #soundButton[aria-pressed="true"] { color: var(--muted); border-color: var(--line); text-decoration: line-through; }
    .community { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .community-link { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--gold); color: var(--gold); text-decoration: none; font-weight: 600; }
    .community-link:hover { background: var(--gold); color: #1b1408; }
    .community-zalo { border-color: #0068ff; color: #6aa8ff; }
    .community-zalo:hover { background: #0068ff; color: #fff; }
    .login-news { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.1); font-size: 12px; }
    .login-news summary { cursor: pointer; color: var(--gold); font-weight: 600; }
    .login-news-list { display: grid; gap: 6px; margin-top: 6px; max-height: 170px; overflow-y: auto; }
    .login-news-item { padding: 6px 8px; border: 1px solid rgba(255,255,255,.08); border-radius: 6px; background: rgba(0,0,0,.28); display: grid; gap: 3px; }
    .login-news-meta { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 11px; }
    .login-news-pin { padding: 1px 6px; border-radius: 999px; background: rgba(212,175,55,.22); border: 1px solid var(--gold); color: var(--gold); font-weight: 600; }
    .login-news-title { color: var(--text); font-size: 12px; }
    .login-news-body { margin: 0; color: var(--muted); white-space: pre-line; }
    .login-news-img { max-width: 100%; max-height: 96px; object-fit: cover; border-radius: 4px; margin-top: 2px; }
    .language-picker { pointer-events: auto; display: inline-flex; gap: 4px; align-items: center; }
    .language-picker button { height: 30px; min-width: 38px; padding: 0 8px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font: 600 12px system-ui, sans-serif; }
    .language-picker button[aria-pressed="true"] { color: #1b1408; background: var(--gold); border-color: var(--gold); }
    .language-picker select { height: 30px; max-width: 120px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font: 12px system-ui, sans-serif; }
    #guideButton { pointer-events: auto; width: 30px; height: 30px; padding: 0; border-radius: 50%; font: italic 700 16px/1 Georgia, serif; color: var(--gold); background: var(--panel); border: 1px solid var(--gold); }
    #settingsButton { pointer-events: auto; width: 30px; height: 30px; padding: 0; border-radius: 50%; font: 700 16px/1 system-ui, sans-serif; color: var(--gold); background: var(--panel); border: 1px solid var(--gold); }
    /* The bar: two groups of one height, each one panel; the buttons inside are flat. */
    .hud-group { display: inline-flex; align-items: center; gap: 2px; height: 34px; padding: 0 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; font-variant-numeric: tabular-nums; }
    .hud-status { padding: 0 10px; gap: 6px; font-size: 13px; white-space: nowrap; min-width: 0; }
    .hud-status #heroName { font-weight: 600; color: var(--text); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hud-status #fps { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .hud-sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
    .hud-tools { position: relative; pointer-events: auto; padding: 0 3px; flex-shrink: 0; touch-action: manipulation; }
    #hudToolsToggle { width: 28px; height: 28px; padding: 0; border-radius: 50%; font: 700 16px/1 system-ui, sans-serif; color: var(--gold); background: transparent; border: 1px solid transparent; cursor: pointer; touch-action: manipulation; display: inline-flex; align-items: center; justify-content: center; }
    #hudToolsToggle:hover, .hud-tools.expanded #hudToolsToggle { border-color: var(--gold); background: rgba(212, 175, 55, 0.16); }
    .hud-tools-items { display: none; position: absolute; left: 0; top: calc(100% + 6px); align-items: center; gap: 3px; min-height: 36px; padding: 3px 8px; background: var(--panel); border: 1px solid var(--gold); border-radius: 999px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65); white-space: nowrap; z-index: 60; touch-action: manipulation; }
    .hud-tools.expanded .hud-tools-items { display: inline-flex; }
    .hud-tools #soundButton, .hud-tools #guideButton, .hud-tools #settingsButton { width: 30px; height: 30px; background: transparent; border-color: transparent; touch-action: manipulation; }
    .hud-tools #soundButton:hover, .hud-tools #guideButton:hover, .hud-tools #settingsButton:hover { border-color: var(--gold); }
    .hud-tools .language-picker button, .hud-tools .language-picker select { height: 28px; background: transparent; border-color: transparent; touch-action: manipulation; }
    .hud-tools .language-picker select { padding: 0 4px; line-height: 26px; vertical-align: middle; }
    .hud-tools .language-picker select option { background: #1b2131; color: var(--text); }
    .hud-tools .language-picker button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); }
    @media (max-width: 600px) {
      .hud-tools .language-picker select { max-width: 76px; }
      .hud-status { padding: 0 8px; gap: 5px; font-size: 11.5px; }
      .hud-status #heroName { max-width: 96px; }
      .hud-status #fps { font-size: 11px; }
      .hud-tools.expanded .hud-tools-items { flex-wrap: wrap; border-radius: 14px; max-width: calc(100vw - var(--helper-bar-right, 12px) - 20px); }
    }
    /* The new-player guide waiting as a button while its panel is closed (ui/onboardingWindow.ts). */
    .hnmo-guide-button { position: fixed; z-index: 60; left: max(12px, env(safe-area-inset-left, 0px)); top: calc(max(calc(5.5vh + 6px), env(safe-area-inset-top, 0px)) + 42px); height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--gold); background: var(--panel); color: #ffe9a8; font: 600 12px system-ui, sans-serif; cursor: pointer; }
    .hnmo-guide-button:hover { background: #2a2414; }
    .hnmo-guide-button[hidden] { display: none; }
    .hnmo-guide-button-flash { animation: hnmo-guide-flash 1.2s ease-in-out 3; }
    @keyframes hnmo-guide-flash { 50% { box-shadow: 0 0 12px 3px var(--gold); background: #3a2f12; } }
    /* With the touch HUD: under the hero card on the left, clear of the top-right row and the fight buttons; 36 px to tap. */
    body.hnmo-modern-hud .hnmo-guide-button { top: 72px; height: 36px; min-width: 36px; }
    #guide { position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, .6); display: grid; place-items: center; padding: 16px; }
    #guide .frame { position: relative; width: min(900px, 100%); height: min(88vh, 100%); background: #0b0e16; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    #guide iframe { width: 100%; height: 100%; border: 0; display: block; }
    #guide .close { position: absolute; right: 10px; top: 10px; padding: 4px 10px; }
    #guide .onboarding { position: absolute; right: 80px; top: 10px; padding: 4px 10px; }
    #guide .timetable { position: absolute; right: 205px; top: 10px; padding: 4px 10px; }
    .map-picker { position: fixed; right: 12px; top: 12px; display: flex; gap: 8px; align-items: center; }
    .map-picker label { color: var(--muted); font-size: 12px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/examples/jsm/loaders/KTX2Loader.js": "/vendor/three/examples/jsm/loaders/KTX2Loader.js"
      }
    }
  </script>
  <link rel="stylesheet" href="/website-themes.css">
  <script type="module">import "/js/websiteThemeEntry.js";</script>
<link rel="stylesheet" href="/website-shell.css">
<script type="module">import "/js/websiteShellEntry.js";</script>
</head>
<body data-website-page="game">
  <div id="stage"><canvas id="view"></canvas></div>
  <div id="labels"></div>
  <div id="guide" hidden role="dialog" aria-label="Guide" data-game-name="{game} guide" data-game-name-attr="aria-label">
    <div class="frame"><iframe title="Guide" src="about:blank"></iframe><button type="button" class="timetable" id="guideTimetable" title="Event and boss timetable (H)">Timetable (H)</button><button type="button" class="onboarding" id="guideOnboarding" title="The guided first steps for new characters (Y)">New-player guide</button><button type="button" class="close">Close</button></div>
  </div>
  <div class="hud" id="hud" hidden>
    <!-- Right beside Auto play: touch-expandable settings/tools toggle followed by hero name and FPS frame rate. -->
    <span class="hud-group hud-tools" id="hudTools">
      <button type="button" id="hudToolsToggle" title="Settings & tools" aria-label="Expand settings and tools" aria-expanded="false" aria-controls="hudToolsDrawer">⚙</button>
      <span class="hud-tools-items" id="hudToolsDrawer">
        <button type="button" id="soundButton" title="Sound on / off" aria-label="Sound on or off" aria-pressed="false">♪</button>
        <button type="button" id="guideButton" title="Guide: what to play and what each feature does" aria-label="Open the guide" data-game-name="Open the {game} guide" data-game-name-attr="aria-label">i</button>
        <span class="hud-sep" aria-hidden="true"></span>
        <span class="language-picker" data-no-i18n role="group" aria-label="Language / Ngôn ngữ"><button type="button" data-lang="en" aria-pressed="true" title="English">EN</button><button type="button" data-lang="vi" aria-pressed="false" title="Tiếng Việt">VN</button><select class="language-more" title="More languages" aria-label="More languages"><option value="">More…</option></select></span>
        <span class="hud-sep" aria-hidden="true"></span>
        <button type="button" id="settingsButton" title="Settings (O)" aria-label="Open the settings">⚙</button>
      </span>
    </span>
    <span class="hud-group hud-status"><span id="heroName">-</span><span class="hud-sep" aria-hidden="true"></span><span id="fps">- fps</span><span id="position" hidden>-</span></span>
  </div>
  <div id="login">
    <form class="panel" id="loginForm" autocomplete="on">
      <img data-brand-logo alt="" width="48" height="48" hidden><h1 data-game-name>HenryN Mu Online</h1>
      <a class="website-login" id="websiteLoginButton" href="/account.html?play=1" data-enter-game>Log in on the website</a>
      <fieldset>
        <div class="row"><label for="username">Account</label><input id="username" name="username" required maxlength="10" autocomplete="username"></div>
        <div class="row"><label for="password">Password</label><input id="password" name="password" type="password" required maxlength="20" autocomplete="current-password"></div>
        <details>
          <summary>Server</summary>
          <div class="split">
            <div class="row"><label for="host">Connect server</label><input id="host" name="host" required></div>
            <div class="row"><label for="port">Port</label><input id="port" name="port" type="number" min="1" max="65535" required></div>
          </div>
          <div class="row"><label for="relay">Relay</label><input id="relay" name="relay" required></div>
        </details>
        <div class="row"><label>Language / Ngôn ngữ</label><span class="language-picker" id="loginLanguage" data-no-i18n role="group" aria-label="Language / Ngôn ngữ"><button type="button" data-lang="en" aria-pressed="true" title="English">EN</button><button type="button" data-lang="vi" aria-pressed="false" title="Tiếng Việt">VN</button><select class="language-more" title="More languages" aria-label="More languages"><option value="">More…</option></select></span></div>
        <div class="buttons">
          <button class="primary" type="submit">Connect</button>
        </div>
      </fieldset>
      <div class="saved-accounts" id="savedAccounts" hidden></div>
      <p id="loginError" role="alert" hidden></p>
      <div class="choices" id="servers" hidden></div>
      <div class="choices" id="characters" hidden></div>
      <p class="hint community" id="communityLinks" data-community-links="Contact:" hidden></p>
      <div class="login-news" id="loginNewsPanel" hidden></div>
      <p class="hint">New here? <a href="#" id="loginGuide" style="color:var(--gold)">Read the guide</a>.</p>
    </form>
  </div>
  <div id="loading" class="chip"><div id="status">Log in to play.</div><div id="track"><div id="bar"></div></div></div>
  <script type="module" src="/js/main.js"></script>
  <script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw-game.js').catch(function () {}); }</script>
</body>
</html>
