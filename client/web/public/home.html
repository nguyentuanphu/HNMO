<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#11110e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/images/icon-192.png" />
    <link rel="apple-touch-icon" href="/images/icon-192.png" />
    <title>{game}</title>
    <link rel="stylesheet" href="/home.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="#"
        ><span class="crest">H</span><span data-game-name></span
      ></a>
      <nav>
        <a href="#realm" data-t="realm"></a
        ><a href="#schedule" data-t="scheduleNav"></a
        ><a href="#newplayers" data-t="newNav"></a
        ><a href="#missions" data-t="missionsNav"></a
        ><a href="#bosses" data-t="bossesNav"></a
        ><a href="#rankings" data-t="rankingsNav"></a
        ><a href="#account" data-t="accountNav"></a
        ><a href="#start" data-t="start"></a
        ><details class="nav-more">
          <summary data-t="explore"></summary>
          <div class="nav-more-menu">
            <a href="#guilds" data-t="guildsNav"></a>
            <a href="#social" data-t="communityNav"></a>
            <a href="#races" data-t="racesNav"></a>
            <a href="#gifts" data-t="giftNav"></a>
            <a href="#resets" data-t="resetsNav"></a>
            <a href="#market" data-t="marketNav"></a>
            <a href="#jewel-bank" data-t="jbNav"></a>
            <a href="#catchup" data-t="cuNav"></a>
            <a href="#season-plan" data-t="spNav"></a>
            <a href="#leftovers" data-t="leftoversNav"></a>
            <a href="#mounts" data-t="mountsNav"></a>
            <a href="#party-spots" data-t="partySpotsNav"></a>
            <a href="#events" data-t="events"></a>
            <a href="#world" data-t="world"></a>
            <a href="#phone" data-t="phoneNav"></a>
          </div>
        </details>
      </nav>
      <div class="languages">
        <button id="en" lang="en">EN</button
        ><button id="vi" lang="vi">VI</button>
      </div>
      <a class="small-button" href="/account.html" data-t="account"></a>
    </header>
    <main>
      <section class="hero">
        <div class="hero-art" aria-hidden="true"></div>
        <div class="hero-content">
          <p class="eyebrow" data-t="eyebrow"></p>
          <h1 data-t="hero"></h1>
          <p class="intro" data-t="intro"></p>
          <div class="actions">
            <a class="primary" href="/index.html" data-t="play"></a
            ><a class="secondary" href="#realm" data-t="explore"></a>
          </div>
          <p class="caption" data-t="browser"></p>
        </div>
        <div class="hero-footer">
          <span data-t="live"></span><span id="connection" role="status"></span
          ><button id="refresh" data-t="refresh"></button>
        </div>
      </section>
      <section id="realm">
        <div class="section-head">
          <div>
            <p class="eyebrow" data-t="source"></p>
            <h2 data-t="realmTitle"></h2>
          </div>
          <label
            ><span data-t="server"></span>
            <select id="server" aria-label="Server"></select
          ></label>
        </div>
        <p id="notice" role="status"></p>
        <div id="worlds-group" class="worlds-group"></div>
        <div class="stats" id="stats"></div>
        <div class="realm-bottom">
          <p data-t="truth"></p>
          <span id="updated"></span>
        </div>
      </section>
      <section id="events">
        <div class="section-head">
          <div>
            <p class="eyebrow">01 / <span data-t="events"></span></p>
            <h2 data-t="eventTitle"></h2>
          </div>
          <span class="muted" data-t="eventHint"></span>
        </div>
        <div id="event-list" class="event-list"></div>
      </section>
      <section id="schedule">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="scheduleNav"></span></p>
            <h2 data-t="scheduleTitle"></h2>
          </div>
          <span class="muted" id="timezone"></span>
        </div>
        <p class="muted" id="details-notice" role="status"></p>
        <div id="upcoming" class="upcoming"></div>
        <div id="timetable-filters" class="row" style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"></div>
        <p class="muted" id="timetable-notice" role="status"></p>
        <table id="timetable-table"></table>
        <p class="muted" id="timetable-gm-winners"></p>
      </section>
      <section id="newplayers">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="newNav"></span></p>
            <h2 data-t="newTitle"></h2>
          </div>
        </div>
        <p class="muted" data-t="newHint"></p>
        <p class="muted" id="newplayers-notice" role="status"></p>
        <div id="newplayers-kit" class="mission-list"></div>
        <h3 class="mission-period" id="newplayers-steps-head" data-t="newSteps"></h3>
        <div id="newplayers-steps" class="mission-list"></div>
        <p class="muted" id="newplayers-extra"></p>
      </section>
      <section id="missions">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="missionsNav"></span></p>
            <h2 data-t="missionsTitle"></h2>
          </div>
          <span class="muted" id="missions-reset"></span>
        </div>
        <p class="muted" data-t="missionsHint"></p>
        <p class="muted" id="missions-notice" role="status"></p>
        <h3 class="mission-period" data-t="missionsDaily"></h3>
        <div id="missions-daily" class="mission-list"></div>
        <h3 class="mission-period" data-t="missionsWeekly"></h3>
        <div id="missions-weekly" class="mission-list"></div>
        <p class="muted" id="missions-extra"></p>
      </section>
      <section id="bosses">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="bossesNav"></span></p>
            <h2 data-t="bossesTitle"></h2>
          </div>
        </div>
        <p class="muted" data-t="bossesHint"></p>
        <p class="muted" id="bosses-notice" role="status"></p>
        <div id="bosses-list" class="boss-list"></div>
        <h3 class="mission-period" data-t="bossesNews"></h3>
        <ul id="bosses-news" class="boss-news"></ul>
        <div class="section-head">
          <h3 class="mission-period" data-t="bossesWeek"></h3>
          <span class="muted" id="bosses-week-ends"></span>
        </div>
        <div id="bosses-week" class="boss-rankings"></div>
        <h3 class="mission-period" data-t="bossesLastWeek"></h3>
        <div id="bosses-last-week" class="boss-rankings"></div>
        <p class="muted" id="bosses-siege"></p>
      </section>
      <section id="lucky-number">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="luckyNav"></span></p>
            <h2 data-t="luckyTitle"></h2>
          </div>
          <span class="muted" id="lucky-draw-time"></span>
        </div>
        <p class="muted" id="lucky-summary"></p>
        <p class="muted" id="lucky-notice" role="status"></p>
        <div class="table-wrap"><table id="lucky-draws" class="table"></table></div>
      </section>
      <section id="marriage">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="marriageNav"></span></p>
            <h2 data-t="marriageTitle"></h2>
          </div>
          <span class="muted" id="marriage-rules"></span>
        </div>
        <p class="muted" id="marriage-notice" role="status"></p>
        <div class="table-wrap"><table id="marriage-couples" class="table"></table></div>
      </section>
      <section id="guilds">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="guildsNav"></span></p>
            <h2 data-t="guildsTitle"></h2>
          </div>
          <span class="muted" id="guilds-week-ends"></span>
        </div>
        <p class="muted" data-t="guildsHint"></p>
        <p class="muted" id="guilds-notice" role="status"></p>
        <div class="world-grid">
          <article class="panel">
            <h3 data-t="guildsLadder"></h3>
            <div class="table-wrap"><table id="guilds-ladder" class="table"></table></div>
            <p class="muted" id="guilds-rewards"></p>
          </article>
          <article class="panel">
            <h3 data-t="guildsLastWeek"></h3>
            <p class="muted" id="guilds-last-week-of"></p>
            <div class="table-wrap"><table id="guilds-last-week" class="table"></table></div>
          </article>
          <article class="panel">
            <h3 data-t="guildsAll"></h3>
            <div class="table-wrap"><table id="guilds-all" class="table"></table></div>
          </article>
          <article class="panel">
            <h3 data-t="guildsSieges"></h3>
            <ul id="guilds-sieges" class="boss-news"></ul>
          </article>
        </div>
        <h3 class="mission-period" data-t="guildsLevels"></h3>
        <div class="table-wrap"><table id="guilds-levels" class="table"></table></div>
        <p class="muted" id="guilds-sources"></p>
      </section>
      <section id="social">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="communityNav"></span></p>
            <h2 data-t="communityTitle"></h2>
          </div>
        </div>
        <p class="muted" data-t="communityHint"></p>
        <div id="social-links" data-community-links hidden></div>
        <p class="muted" id="social-notice" role="status"></p>
        <div class="world-grid">
          <article class="panel">
            <h3 data-t="communityCoins"></h3>
            <ul id="social-coins" class="boss-news"></ul>
          </article>
          <article class="panel">
            <h3 data-t="communityEvents"></h3>
            <div id="social-events"></div>
          </article>
          <article class="panel">
            <h3 data-t="communityHighlights"></h3>
            <ul id="social-highlights" class="boss-news"></ul>
          </article>
        </div>
      </section>
      <section id="races">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="racesNav"></span></p>
            <h2 data-t="racesTitle"></h2>
          </div>
        </div>
        <p class="muted" data-t="racesHint"></p>
        <p class="muted" id="races-notice" role="status"></p>
        <h3 data-t="racesRunning"></h3>
        <div id="races-running" class="race-grid"></div>
        <div class="world-grid">
          <article class="panel" id="races-upcoming-panel" hidden>
            <h3 data-t="racesUpcoming"></h3>
            <ul id="races-upcoming" class="boss-news"></ul>
          </article>
          <article class="panel">
            <h3 data-t="racesHistory"></h3>
            <ul id="races-history" class="boss-news"></ul>
          </article>
        </div>
      </section>
      <section id="gifts">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="giftNav"></span></p>
            <h2 data-t="giftTitle"></h2>
          </div>
        </div>
        <p class="muted" data-t="giftHint"></p>
        <p class="muted" id="gift-notice" role="status"></p>
        <p id="gift-account"><a href="/account.html#gift" data-t="giftAccountLink"></a></p>
        <div id="gift-codes" class="race-grid"></div>
      </section>
      <section id="resets">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="resetsNav"></span></p>
            <h2 data-t="resetsTitle"></h2>
          </div>
        </div>
        <p class="muted" data-t="resetsHint"></p>
        <p class="muted" id="resets-notice" role="status"></p>
        <p id="resets-account"><a href="/account.html#resets" data-t="resetsAccountLink"></a></p>
        <div class="world-grid">
          <article class="panel">
            <h3 id="resets-month-title"></h3>
            <div class="table-wrap"><table id="resets-monthly" class="table"></table></div>
          </article>
          <article class="panel">
            <h3 data-t="resetsRelifes"></h3>
            <div class="table-wrap"><table id="resets-relifes" class="table"></table></div>
          </article>
          <article class="panel">
            <h3 id="resets-previous-title"></h3>
            <div class="table-wrap"><table id="resets-previous" class="table"></table></div>
          </article>
          <article class="panel">
            <h3 data-t="resetsRules"></h3>
            <ul id="resets-rules" class="muted"></ul>
          </article>
        </div>
      </section>
      <section id="market">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="marketNav"></span></p>
            <h2 data-t="marketTitle"></h2>
          </div>
        </div>
        <p class="muted" data-t="marketHint"></p>
        <p class="muted" id="market-notice" role="status"></p>
        <div class="table-wrap"><table id="market-table" class="table"></table></div>
      </section>
      <section id="jewel-bank">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="jbNav"></span></p>
            <h2 data-t="jbTitle"></h2>
          </div>
        </div>
        <p class="muted" data-t="jbHint"></p>
        <p class="muted" id="jb-notice" role="status"></p>
        <div class="table-wrap"><table id="jb-table" class="table"></table></div>
      </section>
      <section id="catchup">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="cuNav"></span></p>
            <h2 data-t="cuTitle"></h2>
          </div>
        </div>
        <p class="muted" data-t="cuHint"></p>
        <p class="muted" id="catchup-notice" role="status"></p>
        <div id="catchup-cards" class="boss-list"></div>
      </section>
      <section id="season-plan">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="spNav"></span></p>
            <h2 data-t="spTitle"></h2>
          </div>
        </div>
        <p class="muted" data-t="spHint"></p>
        <p class="muted" id="sp-notice" role="status"></p>
        <div id="sp-timeline" class="boss-list"></div>
      </section>
      <section id="leftovers">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="leftoversNav"></span></p>
            <h2 data-t="leftoversTitle"></h2>
          </div>
          <p class="section-note" id="leftovers-note"></p>
        </div>
        <p id="leftovers-empty" class="empty" hidden></p>
        <div id="leftovers-body" class="world-grid">
          <article class="panel">
            <h3 data-t="leftoversRecipesTitle"></h3>
            <div class="table-wrap"><table id="leftovers-recipes" class="table"></table></div>
          </article>
          <article class="panel">
            <h3 data-t="leftoversOffersTitle"></h3>
            <div class="table-wrap"><table id="leftovers-offers" class="table"></table></div>
          </article>
        </div>
      </section>
      <section id="mounts">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="mountsNav"></span></p>
            <h2 data-t="mountsTitle"></h2>
          </div>
          <p class="section-note" id="mounts-note"></p>
        </div>
        <p id="mounts-empty" class="empty" hidden></p>
        <div id="mounts-body" class="panel">
          <div class="table-wrap"><table id="mounts-table" class="table"></table></div>
        </div>
      </section>
      <section id="party-spots">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="partySpotsNav"></span></p>
            <h2 data-t="partySpotsTitle"></h2>
          </div>
          <p class="section-note" id="party-spots-note"></p>
        </div>
        <p id="party-spots-empty" class="empty" hidden></p>
        <div id="party-spots-body" class="panel">
          <div class="table-wrap"><table id="party-spots-table" class="table"></table></div>
        </div>
      </section>
      <section id="rankings">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="rankingsNav"></span></p>
            <h2 data-t="rankingsTitle"></h2>
          </div>
        </div>
        <div class="world-grid">
          <article class="panel">
            <h3 data-t="topCharacters"></h3>
            <div class="table-wrap"><table id="ranking" class="table"></table></div>
          </article>
          <article class="panel">
            <div class="map-head">
              <h3 data-t="eventRankings"></h3>
              <select id="event-ranking" aria-label="Event"></select>
            </div>
            <div class="table-wrap"><table id="event-table" class="table"></table></div>
          </article>
        </div>
      </section>
      <section id="drops">
        <div class="section-head">
          <div>
            <p class="eyebrow"><span data-t="dropsNav"></span></p>
            <h2 data-t="dropsTitle"></h2>
          </div>
          <span class="muted" data-t="dropsHint"></span>
        </div>
        <div class="table-wrap"><table id="drop-table" class="table"></table></div>
        <button type="button" id="drops-more" class="secondary" hidden></button>
      </section>
      <section id="world">
        <div class="section-head">
          <div>
            <p class="eyebrow">02 / <span data-t="world"></span></p>
            <h2 data-t="worldTitle"></h2>
          </div>
        </div>
        <div class="world-grid">
          <article class="panel">
            <h3 data-t="classes"></h3>
            <div id="classes" class="class-list"></div>
          </article>
          <article class="panel">
            <div class="map-head">
              <h3 data-t="maps"></h3>
              <input
                id="search"
                type="search"
                data-placeholder="search"
                aria-label="Search maps"
              />
            </div>
            <div id="maps" class="maps"></div>
          </article>
        </div>
      </section>
      <section id="account" class="account">
        <div class="section-head">
          <div>
            <p class="eyebrow">03 / <span data-t="accountNav"></span></p>
            <h2 data-t="accountTitle"></h2>
          </div>
        </div>
        <div class="world-grid">
          <article class="panel">
            <h3 data-t="registerTitle"></h3>
            <form id="register" class="form" autocomplete="on">
              <label><span data-t="loginName"></span><input name="loginName" required minlength="3" maxlength="10" pattern="[A-Za-z0-9]+" autocomplete="username" /></label>
              <label><span data-t="password"></span><input name="password" type="password" required minlength="3" maxlength="20" autocomplete="new-password" /></label>
              <label><span data-t="email"></span><input name="email" type="email" maxlength="60" autocomplete="email" /></label>
              <button class="primary" type="submit" data-t="registerButton"></button>
              <p class="form-message" id="register-message" role="status"></p>
            </form>
          </article>
          <article class="panel">
            <h3 data-t="googleTitle"></h3>
            <p class="muted" id="google-off" data-t="googleOff"></p>
            <div id="google-button" hidden></div>
            <form id="google-account" class="form" hidden>
              <p class="muted" data-t="googleNew"></p>
              <label><span data-t="loginName"></span><input name="loginName" required minlength="3" maxlength="10" pattern="[A-Za-z0-9]+" /></label>
              <label><span data-t="password"></span><input name="password" type="password" required minlength="3" maxlength="20" autocomplete="new-password" /></label>
              <button class="primary" type="submit" data-t="registerButton"></button>
            </form>
            <form id="google-linked" class="form" hidden>
              <p><span data-t="googleLinked"></span> <strong id="google-login"></strong></p>
              <label><span data-t="newPassword"></span><input name="newPassword" type="password" minlength="3" maxlength="20" autocomplete="new-password" /></label>
              <button type="submit" data-t="setPassword"></button>
              <a class="primary" href="/index.html" id="google-play" data-t="play"></a>
            </form>
            <p class="form-message" id="google-message" role="status"></p>
          </article>
        </div>
      </section>
      <section id="phone" class="start">
        <p class="eyebrow" data-t="phoneNav"></p>
        <h2 data-t="phoneTitle"></h2>
        <p class="muted" data-t="phoneIntro"></p>
        <div class="steps">
          <article>
            <b>01</b>
            <h3 data-t="phoneOpen"></h3>
            <p data-t="phoneOpenText"></p>
            <a href="/index.html" data-t="play"></a>
          </article>
          <article>
            <b>02</b>
            <h3 data-t="phoneInstall"></h3>
            <p data-t="phoneInstallText"></p>
          </article>
          <article>
            <b>03</b>
            <h3 data-t="phoneControls"></h3>
            <p data-t="phoneControlsText"></p>
          </article>
        </div>
      </section>
      <section id="start" class="start">
        <p class="eyebrow" data-t="adventure"></p>
        <h2 data-t="startTitle"></h2>
        <div class="steps">
          <article>
            <b>01</b>
            <h3 data-t="create"></h3>
            <p data-t="createText"></p>
            <a href="/account.html" data-t="account"></a>
          </article>
          <article>
            <b>02</b>
            <h3 data-t="choose"></h3>
            <p data-t="chooseText"></p>
            <a href="/index.html" data-t="play"></a>
          </article>
          <article>
            <b>03</b>
            <h3 data-t="download"></h3>
            <p data-t="downloadText"></p>
            <a
              href="https://github.com/nguyentuanphu/HNMO/releases/latest/download/HNMO.zip"
              data-t="downloadLink"
            ></a>
          </article>
        </div>
      </section>

      <section class="panel" id="topup-milestones-section" hidden>
        <h2 id="topup-milestones-heading">Top-up milestones</h2>
        <p id="topup-milestones-notice" class="muted"></p>
        <div id="topup-milestones-list" class="grid"></div>
      </section>
    </main>
    <footer>
      <div id="community" data-community-links hidden></div>
      <span data-game-name></span><span data-t="footer"></span
      ><a href="#" data-t="top"></a>
    </footer>
    <script type="module" src="/js/website.js"></script>
  </body>
</html>
