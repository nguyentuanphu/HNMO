<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{game}</title>
  <link rel="stylesheet" href="/website-tracker.css">
  <link rel="stylesheet" href="/website-themes.css">
  <link rel="stylesheet" href="/website-shell.css">
  <script type="module" src="/js/websiteThemeEntry.js"></script>
  <script type="module" src="/js/websiteShellEntry.js"></script>
</head>
<body data-website-page="tracker">
  <main id="item-history" data-no-i18n>
    <a href="/home.html"><img data-brand-logo alt="" width="48" height="48" hidden><span data-game-name></span></a>
    <span class="tracker-languages" role="group" aria-label="Language / Ngôn ngữ">
      <button type="button" data-site-language="en">English</button>
      <button type="button" data-site-language="vi">Tiếng Việt</button>
    </span>
    <h1 id="jewel-history-heading">Jewel totals and hunters</h1>
    <p><a href="/tracker.html" id="jewel-item-link">Item history</a></p>
    <p id="jewel-status" role="status"></p>
    <section id="jewel-summary" hidden>
      <h2 id="jewel-total-heading"></h2>
      <p id="jewel-total"></p>
      <p id="jewel-bank-total" hidden></p>
      <p id="jewel-date"></p>
      <h2 id="jewel-hunters-heading"></h2>
      <p id="jewel-hunter-note"></p>
      <ol id="item-history-results"></ol>
    </section>
  </main>
  <script type="module" src="/js/siteLanguage.js"></script>
  <script type="module" src="/js/websiteJewelHistory.js"></script>
</body>
</html>
